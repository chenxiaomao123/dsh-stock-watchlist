description:
  en: Draggable floating quote pane covering Shanghai, Shenzhen, Beijing (BSE), Hong Kong, and US symbols — add a stock by code or Chinese name, open its intraday chart, and ask the stock_watch tool for the same numbers.
  zh: 可拖动的自选股行情浮窗，覆盖沪市、深市、北交所、港股、美股与指数；可按代码或中文名称添加，展开当日分时图，并提供读取同一份行情的 stock_watch 工具。
